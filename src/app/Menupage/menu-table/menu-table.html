<button matButton (click)="new()">
    New
</button>

<section class="example-container mat-elevation-z8" tabindex="0">
    <table mat-table [dataSource]="dataSource">

        <!-- No -->
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>No.</th>
            <td mat-cell *matCellDef="let element">
                {{ element.id }}
            </td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">
                {{ element.name }}
            </td>
        </ng-container>

        <ng-container matColumnDef="familyName">
            <th mat-header-cell *matHeaderCellDef>Family Name</th>
            <td mat-cell *matCellDef="let element">
                {{ element.familyName }}
            </td>
        </ng-container>

        <!-- Amount -->
        <ng-container matColumnDef="academy">
            <th mat-header-cell *matHeaderCellDef>Academy</th>
            <td mat-cell *matCellDef="let element">
                {{ element.academy }}
            </td>
        </ng-container>

        <!-- Summary Type -->
        <ng-container matColumnDef="phoneNumber">
            <th mat-header-cell *matHeaderCellDef>Phone Number</th>
            <td mat-cell *matCellDef="let element">
                {{ element.phoneNumber }}
            </td>
        </ng-container>

        <ng-container matColumnDef="isMarry">
            <th mat-header-cell *matHeaderCellDef>Marital status</th>
            <td mat-cell *matCellDef="let element">
                {{ element.isMarry }}
            </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef>Created At</th>
            <td mat-cell *matCellDef="let element">
                {{ element.createdAt | date: 'MM/dd/yyyy' }}
            </td>
        </ng-container>
       
 
        <!-- Action -->
        <ng-container matColumnDef="star">
            <th mat-header-cell *matHeaderCellDef>Action</th>

            <td mat-cell *matCellDef="let element">

                <button mat-icon-button [matMenuTriggerFor]="menu">
                    <mat-icon>more_vert</mat-icon>
                </button>

                <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="onView(element)">
                        <mat-icon>visibility</mat-icon>
                        <span>View</span>
                    </button>

                    <button mat-menu-item (click)="onUpdate(element)">
                        <mat-icon>edit</mat-icon>
                        <span>Update</span>
                    </button>

                    <button mat-menu-item (click)="onDelete(element)">
                        <mat-icon>delete</mat-icon>
                        <span>Delete</span>
                    </button>
                </mat-menu>


            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
</section>
