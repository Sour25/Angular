
<mat-card class="example-card">
    <app-spinner></app-spinner>
    <mat-card-content>
        <form [formGroup]="menuForm" (ngSubmit)="onSave()">
            <div fxLayout="row" fxLayoutAlign="start center">
                <div fxLayout="row" fxFlex="100">

                    <div fxLayout="row wrap" fxFlex="100" style="display: flex; flex-wrap: wrap; gap: 16px;">

                        <mat-form-field appearance="outline" style="flex: 1 1 calc(33.33% - 16px); min-width: 200px;">
                            <mat-label>
                                <span class="custom-mat-label">Name</span>
                            </mat-label>
                            <input matInput type="text" formControlName="name" autocomplete="off" required />
                            <mat-error *ngIf="menuForm.get('name')?.hasError('required')">Enter English name</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline" style="flex: 1 1 calc(33.33% - 16px); min-width: 200px;">
                            <mat-label>
                                <span class="custom-mat-label">FamilyName</span>
                            </mat-label>
                            <input matInput type="text" formControlName="familyName" autocomplete="off" required />
                            <mat-error *ngIf="menuForm.get('familyName')?.hasError('required')">Enter Family
                                name</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline" style="flex: 1 1 calc(33.33% - 16px); min-width: 200px;">
                            <mat-label>
                                <span class="custom-mat-label">Choose a date</span>
                            </mat-label>
                            <input matInput [matDatepicker]="picker" formControlName="createdAt" required />
                            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                            <mat-datepicker #picker></mat-datepicker>
                            <mat-error *ngIf="menuForm.get('createdAt')?.hasError('required')">Enter a valid
                                date</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline" style="flex: 1 1 calc(33.33% - 16px); min-width: 200px;">
                            <mat-label>
                                <span class="custom-mat-label">Academy</span>
                            </mat-label>
                            <input matInput type="text" formControlName="academy" autocomplete="off" required />
                            <mat-error *ngIf="menuForm.get('academy')?.hasError('required')">Enter academy</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline" style="flex: 1 1 calc(33.33% - 16px); min-width: 200px;">
                            <mat-label>
                                <span class="custom-mat-label">Phone Number</span>
                            </mat-label>
                            <input matInput type="text" formControlName="phoneNumber" appPhoneNumberFormat
                                autocomplete="off" required />
                            <mat-error *ngIf="menuForm.get('phoneNumber')?.hasError('required')">Enter Phone
                                Number</mat-error>
                            <mat-error *ng="menuForm.get('phoneNumber')?.hasError('pattern')">Enter valid digits (9-15
                                long)</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline" style="flex: 1 1 calc(33.33% - 16px); min-width: 200px;">
                            <mat-label>
                                <span class="custom-mat-label">Marital Status</span>
                            </mat-label>
                            <input matInput type="text" formControlName="isMarry" autocomplete="off" required />
                            <mat-error *ngIf="menuForm.get('isMarry')?.hasError('required')">Enter is marry</mat-error>
                        </mat-form-field>

                        <mat-form-field appearance="outline" style="flex: 1 1 calc(33.33% - 16px); min-width: 200px;">
                            <mat-label>
                                <span class="custom-mat-label">Email</span>
                            </mat-label>
                            <input matInput type="text" formControlName="email" autocomplete="off" required />
                            <mat-error *ngIf="menuForm.get('email')?.hasError('required')">Enter Email</mat-error>
                        </mat-form-field>

                    </div>
                </div>
            </div>

            <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-start;">
                <button *ngIf="isNew" matButton="elevated" color="primary" type="submit"
                    [disabled]="menuForm.invalid || menuForm.pristine">
                    Save
                </button>

                <button *ngIf="!isNew" matButton="elevated" color="primary" type="submit"
                    [disabled]="menuForm.invalid || menuForm.pristine">
                    Update
                </button>

                <button type="button" matButton="elevated" (click)="onCancel()">
                    Cancel
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
