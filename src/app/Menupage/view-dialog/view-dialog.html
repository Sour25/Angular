<h2 mat-dialog-title>View Detail Data</h2>

<mat-dialog-content class="dialog-content">

    <p><strong>ID:</strong> {{ data?.id }}</p>

    <p><strong>Name:</strong> {{ data?.name }}</p>

    <p><strong>Amount:</strong> {{ data?.familyName }}</p>

    <p><strong>Summary Type:</strong> {{ data?.isMarry }}</p>

    <p><strong>Summary Type:</strong> {{ data?.phoneNumber }}</p>

    <p><strong>Summary Type:</strong> {{ data?.createdAt | date:'MMMM d, y' }}</p>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>
        Close
    </button>
</mat-dialog-actions>
