<h2 mat-dialog-title>View Detail Data</h2>

<mat-dialog-content class="dialog-content">

    <p><strong>ID:</strong> {{ data?.id }}</p>

    <p><strong>Name:</strong> {{ data?.enLabel }}</p>

    <p><strong>Amount:</strong> {{ data?.amount }}</p>

    <p><strong>Summary Type:</strong> {{ data?.summaryType }}</p>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>
        Close
    </button>
</mat-dialog-actions>
