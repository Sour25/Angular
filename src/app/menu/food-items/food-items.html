<mat-card class="food-card">
    <img mat-card-image [src]="food.image">

    <mat-card-content>
        <h3>{{ food.name }}</h3>
        <p>$ {{ food.price }}</p>
    </mat-card-content>

    <mat-card-actions>
        <button mat-mini-button>-</button>
        <span>{{ food.qty || 0 }}</span>
        <button mat-mini-button color="primary">+</button>
    </mat-card-actions>
</mat-card>
