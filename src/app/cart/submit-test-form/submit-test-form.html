<div class="example-container">
    <form [formGroup]="foodForm" (ngSubmit)="submitForm()">
        <mat-form-field appearance="outline">
            <mat-label><span class="custom-mat-label">Khmer Label</span></mat-label>
            <input matInput type="text" formControlName="khLabel" autocomplete="off" required>
            <mat-error>
                Enter khmer label
            </mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label><span class="custom-mat-label">Khmer Label</span></mat-label>
            <input matInput type="text" formControlName="enLabel" autocomplete="off" required>
            <mat-error>
                Enter khmer label
            </mat-error>
        </mat-form-field>

        <button type="submit">Submit</button>
    </form>


</div>
