<div class="app-shell">


    <app-sidebar (pageChange)="setPage($event)"></app-sidebar>

    <div class="main-content">
        <app-topbar></app-topbar>

        <div class="page-body">
            @if (selectedPage !== 'menu') {

            <app-menu-list [cart]="cart" (cartChange)="cart = $event">
            </app-menu-list>

            <app-cart-panel [cart]="cart" (cartChange)="cart = $event">
            </app-cart-panel>

            }

            <!-- MENU BUTTON PAGE -->
            @if (selectedPage === 'menu') {

            <app-menupage></app-menupage>

            }

        </div>
    </div>
</div>
